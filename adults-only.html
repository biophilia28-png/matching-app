<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>미성년자 이용 불가 안내</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 860px; margin: 0 auto; padding: 24px; line-height: 1.7; color:#222; }
    h1, h2 { margin-top: 28px; }
    .box { background:#fff1f2; border-radius:12px; padding:16px; }
    a { color:#111; }
  </style>
</head>
<body>
  <h1>미성년자 이용 불가 안내</h1>
  <div class="box">
    본 서비스는 만 19세 이상 성인만 이용할 수 있습니다.
  </div>

  <h2>1. 이용 제한</h2>
  <p>생년월일 입력, 성인인증 또는 본인인증 과정에서 미성년자로 확인되는 경우 가입 및 이용이 제한됩니다.</p>

  <h2>2. 허위 정보 입력 금지</h2>
  <p>나이, 생년월일, 신원을 허위로 입력하는 행위는 약관 위반이며, 확인 시 즉시 이용 제한 또는 탈퇴 조치될 수 있습니다.</p>

  <h2>3. 보호 목적</h2>
  <p>본 조치는 미성년자 보호, 범죄 예방, 안전한 성인 만남 환경 조성을 위한 것입니다.</p>

  <p><a href="/">메인으로 돌아가기</a></p>
</body>
</html>
