<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>가입</title>

<style>
body {
  font-family: Arial;
  background: #f5f5f5;
  padding: 20px;
}

.box {
  background: white;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 15px;
}

.notice {
  background: #f3e5c3;
}

button {
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 10px;
  background: #ff4d6d;
  color: white;
  font-size: 16px;
  margin-top: 15px;
}

select {
  width: 100%;
  padding: 10px;
  margin: 5px 0;
}

/* 모달 */
.modal {
  display: none;
  position: fixed;
  top:0; left:0;
  width:100%; height:100%;
  background: rgba(0,0,0,0.6);
}

.modal-content {
  background: white;
  padding: 20px;
  margin: 50px auto;
  width: 90%;
  max-height: 70%;
  overflow-y: auto;
  border-radius: 10px;
}
</style>
</head>

<body>

<div class="box notice">
본 서비스는 만 19세 이상만 이용 가능합니다.<br>
본인인증이 필요할 수 있습니다.<br>
채팅 내용은 자동 삭제될 수 있습니다.<br>
신고 및 차단 기능이 제공됩니다.<br>
첫 만남은 공공장소 이용을 권장합니다.
</div>

<div class="box">
<h3>생년월일 입력</h3>

<select id="year"></select>
<select id="month"></select>
<select id="day"></select>

<p>만 19세 이상만 이용 가능</p>

<button onclick="nextPage()">다음</button>
</div>

<div class="box">
<h3>안내</h3>
<p><a href="#" onclick="openModal('privacy')">개인정보처리방침</a></p>
<p><a href="#" onclick="openModal('terms')">이용약관</a></p>
<p><a href="#" onclick="openModal('report')">신고/차단 정책</a></p>
<p><a href="#" onclick="openModal('minor')">미성년자 이용 불가</a></p>
</div>

<!-- 모달 -->
<div id="modal" class="modal" onclick="closeModal()">
  <div class="modal-content" id="modalContent"></div>
</div>

<script>
// 년도 (2026 ~ 1900)
let yearSelect = document.getElementById("year");
for (let i = 2026; i >= 1900; i--) {
  yearSelect.innerHTML += `<option value="${i}">${i}년</option>`;
}

// 월
let monthSelect = document.getElementById("month");
for (let i = 1; i <= 12; i++) {
  monthSelect.innerHTML += `<option value="${i}">${i}월</option>`;
}

// 일
let daySelect = document.getElementById("day");
for (let i = 1; i <= 31; i++) {
  daySelect.innerHTML += `<option value="${i}">${i}일</option>`;
}

// 다음 버튼
function nextPage() {
  let y = document.getElementById("year").value;
  let m = document.getElementById("month").value;
  let d = document.getElementById("day").value;

  let birth = new Date(y, m - 1, d);
  let today = new Date();

  let age = today.getFullYear() - birth.getFullYear();

  if (today < new Date(today.getFullYear(), birth.getMonth(), birth.getDate())) {
    age--;
  }

  if (age < 19) {
    alert("만 19세 이상만 이용 가능합니다.");
    return;
  }

  alert("다음 페이지로 이동!");
  // 실제 페이지 이동
  // window.location.href = "main.html";
}

// 모달 열기
function openModal(type) {
  let content = "";

  if (type === "privacy") {
    content = `
    <h3>개인정보 처리방침</h3>
    본 서비스는 최소한의 개인정보만 수집합니다.<br><br>
    - 수집 항목: 닉네임, 생년월일<br>
    - 이용 목적: 서비스 제공 및 본인 확인<br>
    - 보관 기간: 탈퇴 시 즉시 삭제<br>
    `;
  }

  if (type === "terms") {
    content = `
    <h3>이용약관</h3>
    - 본 서비스는 19세 이상만 이용 가능합니다.<br>
    - 불법 행위 시 계정이 정지됩니다.<br>
    - 서비스 이용 중 발생하는 문제는 책임지지 않습니다.<br>
    `;
  }

  if (type === "report") {
    content = `
    <h3>신고 / 차단 정책</h3>
    - 욕설, 성희롱, 사기 시 신고 가능<br>
    - 신고 시 즉시 검토 후 이용 제한<br>
    - 차단 기능 제공<br>
    `;
  }

  if (type === "minor") {
    content = `
    <h3>미성년자 이용 불가</h3>
    본 서비스는 성인 전용 서비스입니다.<br>
    미성년자 이용 시 계정이 즉시 삭제됩니다.<br>
    `;
  }

  document.getElementById("modalContent").innerHTML = content;
  document.getElementById("modal").style.display = "block";
}

// 모달 닫기
function closeModal() {
  document.getElementById("modal").style.display = "none";
}
</script>

</body>
</html>
