<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#12101d" />
  <title>나의 인연</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <header class="app-header">
      <div>
        <p class="eyebrow">성인 전용 궁합 매칭</p>
        <h1 id="appTitle">나의 인연</h1>
        <p class="subtitle">사주팔자 · MBTI · 별자리 궁합 매칭 앱</p>
      </div>
      <button id="adminHiddenEntry" class="ghost-btn" aria-label="관리자 숨김 진입">앱 정보</button>
    </header>

    <main id="screenRoot" class="screen-root"></main>

    <nav class="bottom-nav" aria-label="하단 메뉴">
      <button data-tab="home" class="nav-btn active">홈</button>
      <button data-tab="match" class="nav-btn">궁합</button>
      <button data-tab="chat" class="nav-btn">채팅</button>
      <button data-tab="profile" class="nav-btn">프로필</button>
      <button data-tab="settings" class="nav-btn">설정</button>
    </nav>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script type="module" src="./app.js"></script>
</body>
</html>
