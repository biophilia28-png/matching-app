<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>궁합 매칭 앱</title>
<style>
body{font-family:Arial;background:#f6f6f6;margin:0;padding:20px}
.card{background:#fff;padding:16px;border-radius:12px;margin-bottom:12px}
.notice{background:#fff3cd;padding:12px;border-radius:10px;margin-bottom:12px}
select,input,button{width:100%;padding:10px;margin-top:6px;border-radius:8px;border:1px solid #ccc}
button{background:#111;color:#fff;border:none}
.small{font-size:13px;color:#666}
</style>
</head>
<body>

<div class="notice">
본 서비스는 만 19세 이상만 이용 가능합니다.<br>
본인인증 또는 성인인증이 필요할 수 있습니다.<br>
채팅 내용은 자동 삭제될 수 있습니다.<br>
신고 및 차단 기능이 제공됩니다.<br>
첫 만남은 공공장소 이용을 권장합니다.
</div>

<div class="card">
<h3>생년월일 입력</h3>
<select id="year"></select>
<select id="month"></select>
<select id="day"></select>

<div class="small">만 19세 이상만 이용 가능</div>
</div>

<div class="card">
<strong>안내</strong>
<div style="margin-top:10px">
<a href="#" onclick="show('privacy')">개인정보처리방침</a><br><br>
<a href="#" onclick="show('terms')">이용약관</a><br><br>
<a href="#" onclick="show('safety')">신고/차단 정책</a><br><br>
<a href="#" onclick="show('adult')">미성년자 이용 불가</a>
</div>
</div>

<div id="content" class="card"></div>

<script>
// 년도 선택 개선
const yearSelect=document.getElementById('year');
const monthSelect=document.getElementById('month');
const daySelect=document.getElementById('day');

for(let y=2007;y>=1950;y--){
  let opt=document.createElement('option');
  opt.value=y; opt.text=y+'년';
  yearSelect.appendChild(opt);
}

for(let m=1;m<=12;m++){
  let opt=document.createElement('option');
  opt.value=m; opt.text=m+'월';
  monthSelect.appendChild(opt);
}

function updateDays(){
  daySelect.innerHTML='';
  let days=31;
  let m=monthSelect.value;
  if([4,6,9,11].includes(Number(m))) days=30;
  if(m==2) days=28;
  for(let d=1;d<=days;d++){
    let opt=document.createElement('option');
    opt.value=d; opt.text=d+'일';
    daySelect.appendChild(opt);
  }
}

monthSelect.addEventListener('change',updateDays);
updateDays();

// 안내 페이지 내용
function show(type){
  let html='';
  if(type==='privacy'){
    html='<h3>개인정보처리방침</h3>정보 수집 및 보호 정책 안내';
  }
  if(type==='terms'){
    html='<h3>이용약관</h3>서비스 이용 규정 안내';
  }
  if(type==='safety'){
    html='<h3>신고/차단 정책</h3>신고 및 안전 정책 안내';
  }
  if(type==='adult'){
    html='<h3>미성년자 이용 불가</h3>만 19세 이상만 이용 가능';
  }
  document.getElementById('content').innerHTML=html;
}
</script>

</body>
</html>
